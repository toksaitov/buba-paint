services:
  research-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: ${BUBA_DASHBOARD_IMAGE:-buba-dashboard:local}
    user: "${BUBA_UID:-1000}:${BUBA_GID:-1000}"
    volumes:
      - type: bind
        source: ${BUBA_RESEARCH_RUNTIME_DIR:-./.docker/research/runtime}
        target: /runtime
      - type: bind
        source: ${BUBA_RESEARCH_WORK_DIR:-./.docker/research/work}
        target: /research
      - type: bind
        source: ${BUBA_DASHBOARD_CONFIG_DIR:-./.docker/research/config}
        target: /config
        read_only: true
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      BUBA_RESEARCH_WORKER_TOKEN: ${BUBA_RESEARCH_WORKER_TOKEN:-}
      BUBA_RESEARCH_WORK_ROOT: /research
      BUBA_DASHBOARD_IMAGE_REF: ${BUBA_DASHBOARD_IMAGE:-buba-dashboard:local}
      BUBA_RESEARCH_WORKER_IMAGE_REF: ${BUBA_RESEARCH_WORKER_IMAGE:-buba-research-worker:local}
      DASHBOARD_DB_PATH: /runtime/dashboard.db
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        mkdir -p /runtime /research
        touch /runtime/dashboard.log
        exec buba-dashboard --config /config/dashboard.toml --static-dir /srv/static >> /runtime/dashboard.log 2>&1
    ports:
      - "${BUBA_RESEARCH_DASHBOARD_PORT:-3002}:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - research

  research-worker:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.research-worker
    image: ${BUBA_RESEARCH_WORKER_IMAGE:-buba-research-worker:local}
    user: "${BUBA_UID:-1000}:${BUBA_GID:-1000}"
    volumes:
      - type: bind
        source: ${BUBA_RESEARCH_RUNTIME_DIR:-./.docker/research/runtime}
        target: /runtime
      - type: bind
        source: ${BUBA_RESEARCH_WORK_DIR:-./.docker/research/work}
        target: /research
      - type: bind
        source: ${BUBA_RESEARCH_SSH_DIR:-${HOME}/.ssh}
        target: /home/buba/.ssh
        read_only: true
    environment:
      HOME: /home/buba
      DASHBOARD_DB_PATH: /runtime/dashboard.db
      BUBA_RESEARCH_WORK_ROOT: /research
      BUBA_RESEARCH_REPO_ROOT: /
      BUBA_RESEARCH_WORKER_ID: ${BUBA_RESEARCH_WORKER_ID:-research-worker-local}
      BUBA_RESEARCH_CONTROLLER_URL: ${BUBA_RESEARCH_CONTROLLER_URL:-}
      BUBA_RESEARCH_MACHINE_ID: ${BUBA_RESEARCH_MACHINE_ID:-research}
      BUBA_RESEARCH_WORKER_TOKEN: ${BUBA_RESEARCH_WORKER_TOKEN:-}
      BUBA_DASHBOARD_IMAGE_REF: ${BUBA_DASHBOARD_IMAGE:-buba-dashboard:local}
      BUBA_RESEARCH_WORKER_IMAGE_REF: ${BUBA_RESEARCH_WORKER_IMAGE:-buba-research-worker:local}
      BUBA_RESEARCH_HEARTBEAT_MS: ${BUBA_RESEARCH_HEARTBEAT_MS:-30000}
      BUBA_RESEARCH_LEASE_MS: ${BUBA_RESEARCH_LEASE_MS:-300000}
      BUBA_RESEARCH_POLL_MS: ${BUBA_RESEARCH_POLL_MS:-5000}
      BUBA_RESEARCH_MAX_STEPS_PER_TICK: ${BUBA_RESEARCH_MAX_STEPS_PER_TICK:-1}
      BUBA_RESEARCH_MAX_TRANSFERS_PER_TICK: ${BUBA_RESEARCH_MAX_TRANSFERS_PER_TICK:-1}
      BUBA_RESEARCH_RSYNC_BIN: ${BUBA_RESEARCH_RSYNC_BIN:-rsync}
      BUBA_RESEARCH_TRANSFERS_ENABLED: ${BUBA_RESEARCH_TRANSFERS_ENABLED:-true}
      BUBA_RESEARCH_TRANSFER_STALE_MS: ${BUBA_RESEARCH_TRANSFER_STALE_MS:-1800000}
      BUBA_RESEARCH_PAINT_BIN: /usr/local/bin/buba-paint
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        mkdir -p /runtime /research
        if touch /runtime/research-worker.log 2>/dev/null; then
          exec buba-research-worker >> /runtime/research-worker.log 2>&1
        fi
        echo "research-worker.log is not writable; logging to stdout" >&2
        exec buba-research-worker
    depends_on:
      research-dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - research

networks:
  research:
    driver: bridge
