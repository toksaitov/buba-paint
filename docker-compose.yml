services:
  paint:
    build:
      context: .
      dockerfile: bots/paint/Dockerfile
    image: buba-paint-bot:local
    user: "${BUBA_UID:-1000}:${BUBA_GID:-1000}"
    volumes:
      - type: bind
        source: ${BUBA_RUNTIME_DIR:-./.docker/runtime}
        target: /runtime
    environment:
      DB_PATH: /runtime/paint.db
      STARTING_BALANCE: ${BUBA_PAINT_BALANCE:-100}
      BUBA_PAINT_LOG_PATH: /runtime/paint.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        mkdir -p /runtime
        touch "$$BUBA_PAINT_LOG_PATH"
        if [ ! -f "$$DB_PATH" ]; then
          buba-paint init-db --db-path "$$DB_PATH" --balance "$$STARTING_BALANCE" >> "$$BUBA_PAINT_LOG_PATH" 2>&1
        fi
        exec buba-paint live --db-path "$$DB_PATH" --balance "$$STARTING_BALANCE" >> "$$BUBA_PAINT_LOG_PATH" 2>&1
    healthcheck:
      test: ["CMD-SHELL", "test -f /runtime/paint.db && test -f /runtime/paint.log"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: buba-agent:local
    user: "${BUBA_UID:-1000}:${BUBA_GID:-1000}"
    volumes:
      - type: bind
        source: ${BUBA_RUNTIME_DIR:-./.docker/runtime}
        target: /runtime
    environment:
      AGENT_SECRET: ${AGENT_SECRET:-dev-agent-secret}
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        while [ ! -f /runtime/paint.db ]; do sleep 1; done
        touch /runtime/paint.log /runtime/agent.log
        exec buba-agent --db-path /runtime/paint.db --port 9090 --poll-interval ${AGENT_POLL_INTERVAL_MS:-10000} --monitor-only --log-path /runtime/paint.log >> /runtime/agent.log 2>&1
    depends_on:
      paint:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: buba-dashboard:local
    user: "${BUBA_UID:-1000}:${BUBA_GID:-1000}"
    volumes:
      - type: bind
        source: ${BUBA_RUNTIME_DIR:-./.docker/runtime}
        target: /runtime
      - type: bind
        source: ${BUBA_DASHBOARD_CONFIG:-./dashboard.toml}
        target: /config/dashboard.toml
        read_only: true
      - type: bind
        source: ${BUBA_RESEARCH_WORK_DIR:-./.docker/research/work}
        target: /research
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      BUBA_RESEARCH_WORKER_TOKEN: ${BUBA_RESEARCH_WORKER_TOKEN:-}
      BUBA_RESEARCH_WORK_ROOT: ${BUBA_RESEARCH_WORK_ROOT:-/research}
      DASHBOARD_DB_PATH: /runtime/dashboard.db
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        touch /runtime/dashboard.log
        exec buba-dashboard --config /config/dashboard.toml --static-dir /srv/static >> /runtime/dashboard.log 2>&1
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
